<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Feedback Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="public-view">
    <div class="container auth-container">
        <h1>Crie sua Nova Senha</h1>
        <form id="resetPasswordForm">
            <p>Digite e confirme sua nova senha abaixo.</p>
            <div class="form-group">
                <div class="label-wrapper"><label for="new-password">Nova Senha</label><button type="button" class="toggle-password-label" title="Mostrar senha">👁️</button></div>
                <input type="password" id="new-password" required>
            </div>
            <div class="form-group">
                <div class="label-wrapper"><label for="confirm-password">Confirmar Nova Senha</label><button type="button" class="toggle-password-label" title="Mostrar senha">👁️</button></div>
                <input type="password" id="confirm-password" required>
            </div>
            <button type="submit" class="btn-primary">Salvar Nova Senha</button>
        </form>
        <div id="status-message" class="status-message" style="display:none;"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script> const supabase_module = supabase; </script>
    <script src="/supabaseClient.js"></script>
    <script>
        function initializeResetPage() {
            if (typeof supabase === 'undefined') {
                setTimeout(initializeResetPage, 100);
                return;
            }
            const form = document.getElementById('resetPasswordForm');
            const statusMessage = document.getElementById('status-message');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');

            const showStatusMessage = (message, isError = false) => {
                statusMessage.textContent = message;
                statusMessage.className = isError ? 'status-message error' : 'status-message success';
                statusMessage.style.display = 'block';
            };

            const toggleButtons = form.querySelectorAll('.toggle-password-label');
            toggleButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const input = btn.closest('.form-group').querySelector('input');
                    if (input.type === 'password') {
                        input.type = 'text';
                        btn.textContent = '🙈';
                    } else {
                        input.type = 'password';
                        btn.textContent = '👁️';
                    }
                });
            });

            // Lida com a atualização da senha quando o usuário chega do link do e-mail
            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === "PASSWORD_RECOVERY") {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        if (newPasswordInput.value.length < 6) {
                            return showStatusMessage('A senha deve ter no mínimo 6 caracteres.', true);
                        }
                        if (newPasswordInput.value !== confirmPasswordInput.value) {
                            return showStatusMessage('As senhas não coincidem.', true);
                        }

                        const { data, error } = await supabase.auth.updateUser({
                            password: newPasswordInput.value
                        });

                        if (error) {
                            showStatusMessage(`Erro ao atualizar a senha: ${error.message}`, true);
                        } else {
                            showStatusMessage('Senha atualizada com sucesso! Você será redirecionado para a página inicial.');
                            setTimeout(() => window.location.href = '/', 3000);
                        }
                    });
                }
            });
        }
        document.addEventListener('DOMContentLoaded', initializeResetPage);
    </script>
</body>
</html>
