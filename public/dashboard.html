<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Feedback Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-view">
    <div class="container">
        <header class="header">
            <h1>Meu Dashboard</h1>
            <div id="user-info" style="display: none;">
                <span id="user-email"></span>
                <button id="logout-btn" class="btn-secondary">Sair</button>
            </div>
        </header>

        <p>Escolha uma opção para começar:</p>
        <div class="home-actions">
            <a href="/search.html" class="action-card">
                <h2>Buscar Feedbacks</h2>
                <p>Navegue, pesquise e copie feedbacks existentes de forma rápida e intuitiva.</p>
            </a>
            <a href="/manage.html" class="action-card">
                <h2>Gerenciar Feedbacks</h2>
                <p>Crie, edite e exclua os títulos e textos dos feedbacks no banco de dados.</p>
            </a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script> const supabase_module = supabase; </script>
    <script src="/supabaseClient.js"></script>
    <script src="/dashboard.js"></script>
</body>
</html>
