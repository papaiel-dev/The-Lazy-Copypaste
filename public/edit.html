<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Texto - The Lazy Copypaste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css"> 
</head>
<body class="app-view">
    <div class="container">
        <h1 id="page-title">Criar Novo Texto</h1>
        <div id="status-message" class="status-message" style="display: none;"></div>
        <form id="editForm">
            <div class="form-group">
                <label for="title">Título</label>
                <input type="text" id="title" placeholder="Ex: Elogios sobre Atendimento" required>
            </div>
            <div class="form-group">
                <label for="text">Conteúdo do Texto</label>
                <textarea id="text" placeholder="Digite o conteúdo aqui..." required></textarea>
            </div>
            <div class="form-actions">
                <button type="button" id="backButton" class="btn-secondary">Voltar</button>
                <button type="submit" id="saveButton" class="btn-primary">Salvar</button>
            </div>
        </form>
    </div>

    <div id="success-modal" class="modal-overlay">
        <div class="modal-content text-center">
            <h2>Sucesso!</h2>
            <p id="success-message-text">Seu texto foi salvo.</p>
            <div class="modal-actions">
                <button id="go-to-manage-btn" class="btn-secondary">Voltar ao Gerenciamento</button>
                <button id="create-another-btn" class="btn-primary">Cadastrar Outro</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script> const supabase_module = supabase; </script>
    <script src="/supabaseClient.js"></script>
    <script src="/edit.js"></script>
</body>
</html>
