<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Texto - Lazy Copypaste</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="app-view">
    <div class="container">
        <header class="header">
            <h1 id="pageTitle">Novo Texto</h1>
            <a href="/manage.html" class="btn-secondary">Cancelar</a>
        </header>

        <form id="editForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="title" placeholder="Ex: Resposta Padrão Suporte" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);">
            </div>
            <div class="form-group">
                <label>Conteúdo do Texto</label>
                <textarea id="text" placeholder="Cole seu texto aqui..." required style="width: 100%; min-height: 200px; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); font-family: inherit;"></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; padding: 15px;">Salvar no Dispositivo</button>
        </form>
    </div>

    <script src="/database.js"></script>
    <script src="/edit.js"></script>
</body>
</html>
