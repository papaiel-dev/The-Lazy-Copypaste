<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lazy Copypaste - Editar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="pageTitle">Novo Texto</h1>
            <a href="/manage.html" class="btn btn-secondary">Cancelar</a>
        </header>

        <div class="edit-form-card">
            <form id="editForm">
                <div class="form-group">
                    <label for="title">Título do Texto</label>
                    <input type="text" id="title" placeholder="Ex: Script de Atendimento" required>
                </div>
                <div class="form-group">
                    <label for="text">Conteúdo</label>
                    <textarea id="text" placeholder="Cole seu texto aqui..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Salvar no Dispositivo</button>
            </form>
        </div>
    </div>

    <script src="/database.js"></script>
    <script src="/edit.js"></script>
</body>
</html>
