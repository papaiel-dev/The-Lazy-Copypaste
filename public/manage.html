<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Textos - Lazy Copypaste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="admin-page">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">LazyCopy</div>
            <nav>
                <a href="/dashboard.html">Início</a>
                <a href="/manage.html" class="active">Meus Textos</a>
                <a href="/edit.html" class="btn-new">+ Novo Texto</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="exportBackup()" class="btn-outline">Exportar Backup</button>
                <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
                <button onclick="document.getElementById('importFile').click()" class="btn-outline">Importar</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>Gerenciar Textos</h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Pesquisar por título ou conteúdo...">
                </div>
            </header>

            <div id="textsContainer" class="texts-grid">
                </div>
        </main>
    </div>

    <script src="/database.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
