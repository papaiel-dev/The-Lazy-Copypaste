<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar - The Lazy Copypaste</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="app-view">
    <div class="container">
        <header class="header">
            <h1>The Lazy Copypaste</h1>
            <nav>
                <a href="/dashboard.html" class="btn-secondary">Voltar</a>
                <a href="/edit.html" class="btn-primary">+ Novo Texto</a>
            </nav>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Pesquisar nos seus textos salvos...">
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 25px;">
            <button onclick="exportBackup()" class="btn-backup">Exportar Backup</button>
            <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
            <button onclick="document.getElementById('importFile').click()" class="btn-backup">Importar Backup</button>
        </div>

        <div id="textsContainer">
            </div>
    </div>

    <script src="/database.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
