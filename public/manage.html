<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Textos - Lazy Copypaste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="app-view">
    <div class="container">
        <header class="header">
            <h1>The Lazy Copypaste</h1>
            <nav>
                <a href="/dashboard.html" class="btn-secondary" style="color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; display: inline-block;">Voltar</a>
                <a href="/edit.html" class="btn-primary" style="color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; display: inline-block;">+ Novo Texto</a>
            </nav>
        </header>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Pesquisar por título ou conteúdo...">
        </div>

        <div class="backup-bar">
            <button onclick="exportBackup()" class="btn-backup">Exportar Backup</button>
            <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
            <button onclick="document.getElementById('importFile').click()" class="btn-backup">Importar Backup</button>
        </div>

        <div id="textsContainer">
            </div>
    </div>

    <script src="/database.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
