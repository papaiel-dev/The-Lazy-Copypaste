<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar - The Lazy Copypaste</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>The Lazy Copypaste</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/dashboard.html" class="btn btn-secondary">Voltar</a>
                <a href="/edit.html" class="btn btn-primary">+ Novo</a>
            </div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar seus textos...">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; justify-content: flex-end;">
            <button onclick="exportBackup()" class="btn btn-secondary" style="font-size: 0.75rem; padding: 6px 12px;">Exportar</button>
            <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
            <button onclick="document.getElementById('importFile').click()" class="btn btn-secondary" style="font-size: 0.75rem; padding: 6px 12px;">Importar</button>
        </div>

        <div id="textsContainer"></div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modalTitle" class="modal-title">Título</h3>
            <p id="modalText" class="modal-text">Texto da mensagem.</p>
            <div id="modalButtons" class="modal-buttons"></div>
        </div>
    </div>

    <script src="/database.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
