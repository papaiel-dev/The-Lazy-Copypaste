<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Textos - Lazy Copypaste</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Meus Textos</h1>
            <nav>
                <a href="/dashboard.html">Voltar</a>
                <a href="/edit.html" class="btn-primary">Novo Texto</a>
            </nav>
        </header>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Pesquisar...">
            <div class="backup-group">
                <button onclick="exportBackup()" class="btn-secondary">Exportar Backup (PC -> Celular)</button>
                <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
                <button onclick="document.getElementById('importFile').click()" class="btn-secondary">Importar Backup</button>
            </div>
        </div>

        <div id="textsContainer"></div>
    </div>

    <script src="/database.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
