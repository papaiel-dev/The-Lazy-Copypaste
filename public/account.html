<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - The Lazy Copypaste</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="app-view">
    <div class="container">
        <div class="header">
            <h1>Minha Conta</h1>
            <a href="/dashboard.html" class="btn-secondary">Voltar ao Dashboard</a>
        </div>

        <h3>Dados Pessoais</h3>
        <form id="updateNameForm" class="form-section">
            <div class="form-group">
                <label for="user-name">Nome (como será exibido)</label>
                <input type="text" id="user-name" placeholder="Digite seu nome">
            </div>
            <button type="submit" class="btn-primary">Salvar Nome</button>
        </form>
        <hr>

        <h3>Alterar Senha</h3>
        <form id="updatePasswordForm" class="form-section">
            <div class="form-group">
                <label for="new-password">Nova Senha (mínimo 6 caracteres)</label>
                <input type="password" id="new-password" required>
            </div>
            <button type="submit" class="btn-primary">Alterar Senha</button>
        </form>
        <hr>

        <h3>Zona de Perigo</h3>
        <div class="danger-zone">
            <p>A exclusão da sua conta é uma ação irreversível. Todos os seus textos serão permanentemente apagados.</p>
            <button id="delete-account-btn" class="btn-danger">Deletar Minha Conta</button>
        </div>
        
        <div id="status-message" class="status-message" style="display:none;"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script> const supabase_module = supabase; </script>
    <script src="/supabaseClient.js"></script>
    <script src="/account.js"></script>
</body>
</html>
